# imserver 配置文件（v0.4.1）
# 所有 v0.4.0 新增键都有默认值，v0.3.0 的配置文件不改也能启动（文件/视频默认开启、通话与重置密码默认关闭）。
# 启动: ./imserver -c config.yaml

server:
  addr: ":8092"            # 监听地址（生产由 Caddy 反代到 127.0.0.1:8092）
  node_id: "node-1"        # 节点名，多实例部署时每台不同
  allow_origins: []        # WebSocket 允许的 Origin（Web 端才需要），留空不校验；如 ["https://im.fansa.ccwu.cc"]

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "im"
  password: "change-me"
  database: "im"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_seconds: 300
  auto_migrate: true       # 启动时自动建表/升级（可重复执行，v0.1.0 的库可原地升级）

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  secret: "请替换为至少32位的随机字符串-openssl-rand-hex-32"
  ttl_hours: 720           # 登录有效期，默认 30 天

# ---------- v0.2.0 新增 ----------

group:
  max_members: 500         # 群成员上限（含群主）

message:
  recall_seconds: 120      # 发送后多少秒内可以撤回

# S3 兼容存储（推荐 Garage；MinIO 等其他 S3 也可用）。用于语音和图片消息。
# 不需要语音/图片时整段删掉（或 enabled: false）即可，其他功能不受影响。
storage:
  # 服务端访问存储的地址（host:port，不带 http://）。
  #   存储在另一台机器（另一个地域）：填公网 HTTPS 域名，如 "s3.fansa.ccwu.cc:443" + use_ssl: true
  #   同地域同 VCN：填存储机的内网 IP，如 "10.0.0.25:3900" + use_ssl: false
  #   同一台机器：  "127.0.0.1:3900" + use_ssl: false
  endpoint: "s3.fansa.ccwu.cc:443"
  use_ssl: true
  # 浏览器访问的地址，写进预签名 URL。必须是独立（子）域名，不能带路径（S3 签名包含路径）。
  public_endpoint: "https://s3.fansa.ccwu.cc"
  access_key: "GK..."      # garage key create 生成
  secret_key: "..."
  bucket: "imchat"         # Garage 需先 garage bucket create imchat
  region: "garage"         # 必须与存储端一致：Garage 默认 garage，MinIO 默认 us-east-1
  # 启动时设置 bucket CORS 允许的网页来源（留空则用 server.allow_origins，再空则 *）
  cors_origins: ["https://im.fansa.ccwu.cc"]
  voice_ttl_days: 7        # 服务器只保留语音 7 天（启动时自动设置 bucket 生命周期规则）；客户端收到后永久保存在本地
  voice_max_seconds: 60    # 单条语音最长秒数
  voice_max_bytes: 2097152 # 单条语音最大字节数（2MB）
  set_lifecycle: true      # 启动时自动设置生命周期 + CORS（access key 需要 owner 权限）
  verify_upload: true      # 发送语音/图片时服务端检查对象大小与文件头（每条 2 次请求）；跨地域嫌慢可改 false
  presign_put_seconds: 300 # 上传链接有效期
  presign_get_seconds: 300 # 下载链接有效期
  # ---------- v0.3.0 新增 ----------
  image_max_bytes: 10485760 # 单张图片最大字节数（10MB）；只允许 JPEG / PNG / WebP / GIF
  image_ttl_days: 0         # 服务器保留图片的天数；0 = 永久保存（不加生命周期规则）
  # ---------- v0.4.0 新增 ----------
  file_max_bytes: 104857600  # 单个文件最大字节数（100MB）；文件无格式白名单
  file_ttl_days: 0           # 服务器保留文件的天数；0 = 永久保存
  video_max_bytes: 104857600 # 单个视频最大字节数（100MB）；只允许 MP4 / WebM / QuickTime
  video_max_seconds: 600     # 单个视频最长秒数
  video_ttl_days: 0          # 服务器保留视频的天数；0 = 永久保存
  avatar_max_bytes: 2097152  # 头像最大字节数（2MB）；格式同图片

# ---------- v0.3.0 新增：语音转文字 ----------
# 默认关闭。开启需要对象存储（服务端从存储读取语音再送给提供方）。
stt:
  enabled: false
  provider: groq            # groq | cloudflare
  fallback: cloudflare      # 可留空；主提供方失败（5xx/超时/429）时尝试（未填凭据则忽略）
  language: zh              # 可留空让模型自动识别
  daily_limit_per_user: 50  # 每用户每天次数（Asia/Shanghai 日界），0 = 不限；已缓存的结果不计次
  timeout_seconds: 30       # 单次请求提供方的超时
  groq:
    api_key: ""             # https://console.groq.com/keys
    model: whisper-large-v3-turbo
    # base_url: "https://api.groq.com/openai/v1"        # 默认值；测试/代理时可改
  cloudflare:
    account_id: ""
    api_token: ""           # 需要 Workers AI 权限
    model: "@cf/openai/whisper-large-v3-turbo"
    # base_url: "https://api.cloudflare.com/client/v4"  # 默认值；测试/代理时可改

# ---------- v0.4.0 新增：1 对 1 音视频通话 ----------
# 媒体走 WebRTC P2P 直连，Cloudflare Realtime TURN 做 NAT 穿透兜底；默认关闭。
# 注意：本版没有离线推送，对方 App 没有在线连接时打不通（只留一条未接听记录）。
calls:
  enabled: false
  ring_timeout_seconds: 60    # 响铃超时秒数，超时按未接听结束
  credential_ttl_seconds: 14400 # TURN 临时凭证有效期（秒）
  turn_key_id: ""             # Cloudflare 控制台 Realtime → TURN 创建的 Key ID
  turn_api_token: ""          # 对应的 API Token（只存服务端，不要下发给客户端）
  # base_url: "https://rtc.live.cloudflare.com/v1"  # 默认值；测试/代理时可改

# ---------- v0.4.0 新增：重置密码发信 ----------
# 默认关闭。开启后登录页显示“忘记密码”，重置链接落在网页端 /reset-password 页。
smtp:
  enabled: false
  host: ""                    # 如 smtp.example.com
  port: 587
  username: ""                # 可留空（不做 SMTP AUTH）
  password: ""
  from: ""                    # 发件邮箱，如 no-reply@example.com
  tls_mode: "starttls"        # starttls | tls | none
  reset_url_base: ""          # 网页端公开地址，如 https://im.fansa.ccwu.cc（拼重置链接用）
  token_ttl_minutes: 30       # 重置链接有效期（分钟）
  rate_limit_per_hour: 5      # 同一邮箱每小时最多发几封重置邮件，0 = 不限

log:
  level: "info"            # debug | info | warn | error
